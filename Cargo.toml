[package]
name = "wiretap-catalog"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Parser, validator, decoder, and writer for WireTAP-format device catalogues (TOML) across CAN, Serial, and Modbus."
repository = "https://github.com/Wired-Square/wiretap-lib-rs"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
thiserror = "2"
can-dbc = "8"

[dev-dependencies]
serde_json = "1"
