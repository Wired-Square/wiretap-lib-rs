# Workspace root for the WireTAP Rust libraries. `wiretap-catalog` is the first
# member; further related crates go under `crates/<name>/` and share the
# metadata below via `<field>.workspace = true`.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/Wired-Square/wiretap-lib-rs"
