# cargo-release config (workspace-shared) — the one canonical release path.
#
#   cargo install cargo-release                 # once per machine
#   cargo release -p wiretap-catalog patch      # dry-run preview (0.6.1 -> 0.6.2)
#   cargo release -p wiretap-catalog patch -x   # --execute: bump, commit, tag, push
#   cargo release -p wiretap-catalog minor -x   # 0.6.1 -> 0.7.0
#
# Distributed by git tag — consumers pin `tag = "vX.Y.Z"` and build from source
# — so we never publish to crates.io. The pre-release hook runs the exact CI
# gate (fmt · clippy · test), so a tag is never cut from a red tree.

publish = false
push = true
allow-branch = ["main"]
tag-name = "v{{version}}"
pre-release-commit-message = "Release v{{version}}"

# CI parity, run before the version is committed/tagged.
pre-release-hook = [
    "bash",
    "-c",
    "cargo fmt --all --check && cargo clippy --workspace --all-targets -- -D warnings && cargo test --all",
]

# Keep the README's pin example pointing at the version being released.
pre-release-replacements = [
    { file = "README.md", search = 'tag = "v[0-9]+\.[0-9]+\.[0-9]+"', replace = 'tag = "v{{version}}"' },
]
